# serverless.yml

service: actingwebdemo

plugins:
  - serverless-python-requirements
  - serverless-wsgi
  - serverless-domain-manager
  - serverless-dotenv-plugin
  # If you want to use pseudo parameters, add this plugin
  #- serverless-pseudo-parameters
custom:
  stage: ${opt:stage, 'prod'}
  dotenv:
    exclude:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION
      - AWS_DB_PREFIX
      - AWS_DB_HOST
  customDomain:
    domainName: 'demo.actingweb.io'
    basePath: ""
    certificateArn: "arn:aws:acm:us-west-1:473852420549:certificate/1035b2fa-35c1-42ac-b70e-250f12b46800"
    endpointType: "regional"
    createRoute53Record: false
    autoDomain: false
    apiType: http  # Use HTTP API v2 instead of REST API
  wsgi:
    app: application.app
    packRequirements: false
  pythonRequirements:
    # false deliberately: dockerizePip runs pip inside an isolated container
    # that only mounts serverless-python-requirements' own cache dirs, not
    # this project's checkout -- but `actingweb` is a Poetry *path*
    # dependency (see pyproject.toml), which `poetry export` turns into
    # `actingweb @ file:///<absolute checkout path>/vendor/actingweb`. That
    # absolute path doesn't exist inside the container, so dockerizePip
    # failed outright: "No such file or directory: '.../vendor/actingweb'".
    # CI (deploy.yml) already runs on a Linux x86_64 GitHub Actions runner,
    # the same platform Lambda's default architecture targets, so
    # dockerizing purely to cross-compile isn't needed here -- pip just
    # runs directly against the real checkout, where that file:// path is
    # valid.
    dockerizePip: false
    poetry: true
    poetryWithoutHashes: true
    slim: true
    slimPatterns:
      - "**/*.py[c|o]"
      - "**/__pycache__*"
      - "**/*.dist-info*"
      - "**/*.egg-info*"
      - "**/tests/**"
      - "**/test/**"
      - "**/.pytest_cache/**"
      - "**/docs/**"
      - "**/examples/**"
      # This trims *installed pip dependencies* only (third-party packages'
      # bundled examples/tests/docs) -- it doesn't touch vendor/actingweb/,
      # which is project source, not a pip dependency. The actingweb wheel
      # this installs from never has examples/ anyway (deliberately
      # excluded from the package build), so this line was never at odds
      # with vendor/actingweb/examples/demo/ -- that's handled by
      # package.patterns below instead.
    noDeploy:
      - boto3
      - botocore
      - s3transfer
      - jmespath
      - docutils
      - urllib3
      - python-dateutil
      - six

package:
  individually: false
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.venv/**'
    - '!__pycache__/**'
    - '!.pytest_cache/**'
    - '!tests/**'
    - '!.vscode/**'
    - '!.idea/**'
    - '!*.pyc'
    - '!*.pyo'
    - '!.env*'
    - '!docker-compose.yml'
    - '!Dockerfile'
    - '!.dockerignore'
    - '!.gitignore'
    - '!README.md'
    - '!OAUTH_SETUP.md'
    - '!LICENSE.md'
    - '!CHANGELOG.md'
    - '!poetry.lock'
    - '!pyproject.toml'
    # vendor/actingweb/ is the whole actingweb repo (a git submodule --
    # git can't check out a single subdirectory of one), checked out here
    # purely so application.py can reach examples/demo/. actingweb the
    # *package* is installed separately via pip/poetry, so its own
    # actingweb/ subdirectory below is redundant weight; excluded along
    # with everything else in the submodule that isn't the demo app.
    - '!vendor/actingweb/**'
    - 'vendor/actingweb/examples/demo/**'
    - '!vendor/actingweb/examples/demo/__pycache__/**'
    - '!vendor/actingweb/examples/demo/**/__pycache__/**'

provider:
  # No `profile:` here deliberately: setting one forces the AWS SDK to
  # resolve credentials from a named profile in ~/.aws/credentials and
  # skips its env-var provider entirely -- breaks CI, which has no such
  # file and relies solely on the AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
  # env vars aws-actions/configure-aws-credentials exports in deploy.yml.
  # For a manual local deploy, export those two env vars (or run
  # `export AWS_PROFILE=your-profile-name`) before `serverless deploy`.
  name: aws
  runtime: python3.11
  memorySize: 256
  timeout: 29
  stage: ${self:custom.stage}
  region: us-west-1
  httpApi:
    # Use HTTP API v2 instead of REST API to avoid header remapping issues
    # HTTP API doesn't remap WWW-Authenticate header (critical for OAuth2)
    cors: true
    payload: '2.0'
  environment:
    APP_HOST_FQDN: 'demo.actingweb.io'
    APP_HOST_PROTOCOL: 'https://'
    LOG_LEVEL: 'DEBUG' # We use debug as this is a demo app
    OAUTH_CLIENT_ID: '${env:OAUTH_CLIENT_ID}'
    OAUTH_CLIENT_SECRET: '${env:OAUTH_CLIENT_SECRET}'
    OAUTH_PROVIDER: '${env:OAUTH_PROVIDER, "google"}'  # "google" or "github"
    NUKE_SECRET: '${env:NUKE_SECRET, ""}'  # Secret for /nuke endpoint (test cleanup)
  iam:
    role:   
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:CreateTable
            - dynamodb:DescribeTable
          Resource: "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/demo_*"

functions:
  app:
    handler: wsgi_handler.handler
    events:
      - httpApi: '*'  # Use HTTP API v2 instead of REST API to preserve WWW-Authenticate header
