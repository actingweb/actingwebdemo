# serverless.yml

service: actingwebdemo

plugins:
  - serverless-python-requirements
  - serverless-wsgi
  - serverless-domain-manager
  - serverless-dotenv-plugin
  # If you want to use pseudo parameters, add this plugin
  #- serverless-pseudo-parameters
custom:
  stage: ${opt:stage, 'prod'}
  dotenv:
    exclude:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION
      - AWS_DB_PREFIX
      - AWS_DB_HOST
  customDomain:
    domainName: 'demo.actingweb.io'
    basePath: ""
    certificateArn: "arn:aws:acm:us-west-1:473852420549:certificate/1035b2fa-35c1-42ac-b70e-250f12b46800"
    endpointType: "regional"
    createRoute53Record: false
    autoDomain: false
    apiType: http  # Use HTTP API v2 instead of REST API
  wsgi:
    app: application.app
    packRequirements: false
  pythonRequirements:
    # true deliberately, despite CI already running on Linux x86_64 (the
    # same platform Lambda's default architecture targets): a plain pip
    # install on the GitHub Actions runner picks up manylinux wheels built
    # against *that runner's* (newer) glibc baseline, not Lambda's
    # (older) Amazon Linux runtime. Confirmed the hard way -- disabling
    # dockerizePip fixed packaging but broke `cryptography`'s compiled
    # Rust extension at runtime:
    #   /lib64/libc.so.6: version `GLIBC_2.28' not found (required by
    #   .../cryptography/hazmat/bindings/_rust.abi3.so)
    # which silently broke Google OAuth2 login (falls back to standard
    # actor creation instead of erroring loudly). dockerizePip: true
    # builds against public.ecr.aws/sam/build-python3.11, AWS's own
    # Lambda-matching build image, which is the actual fix.
    #
    # That reintroduces the container-mount problem dockerizePip: false
    # was working around: `actingweb` is a Poetry *path* dependency (see
    # pyproject.toml), which `poetry export` turns into
    # `actingweb @ file:///<absolute checkout path>/vendor/actingweb` --
    # an absolute host path invisible inside the container, which only
    # mounts serverless-python-requirements' own cache dirs by default.
    # dockerRunCmdExtraArgs below mounts the actual checkout at the same
    # absolute path inside the container too, so that file:// reference
    # resolves there exactly as it does on the host. GITHUB_WORKSPACE is
    # deploy.yml's checkout root; PWD is the fallback for a manual local
    # deploy (must be run from the repo root, as documented in README.md).
    dockerizePip: true
    dockerRunCmdExtraArgs:
      - '-v'
      - '${env:GITHUB_WORKSPACE, env:PWD}:${env:GITHUB_WORKSPACE, env:PWD}'
    poetry: true
    poetryWithoutHashes: true
    slim: true
    slimPatterns:
      - "**/*.py[c|o]"
      - "**/__pycache__*"
      - "**/*.dist-info*"
      - "**/*.egg-info*"
      - "**/tests/**"
      - "**/test/**"
      - "**/.pytest_cache/**"
      - "**/docs/**"
      - "**/examples/**"
      # This trims *installed pip dependencies* only (third-party packages'
      # bundled examples/tests/docs) -- it doesn't touch vendor/actingweb/,
      # which is project source, not a pip dependency. The actingweb wheel
      # this installs from never has examples/ anyway (deliberately
      # excluded from the package build), so this line was never at odds
      # with vendor/actingweb/examples/demo/ -- that's handled by
      # package.patterns below instead.
    noDeploy:
      - boto3
      - botocore
      - s3transfer
      - jmespath
      - docutils
      - urllib3
      - python-dateutil
      - six

package:
  individually: false
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.venv/**'
    - '!__pycache__/**'
    - '!.pytest_cache/**'
    - '!.mypy_cache/**'
    - '!.ruff_cache/**'
    - '!.claude/**'
    - '!.devcontainer/**'
    - '!.completed_requirements'
    - '!infra/**'
    - '!iam_policy.json'
    - '!tests/**'
    - '!.vscode/**'
    - '!.idea/**'
    - '!*.pyc'
    - '!*.pyo'
    - '!.env*'
    - '!docker-compose.yml'
    - '!Dockerfile'
    - '!.dockerignore'
    - '!.gitignore'
    - '!README.md'
    - '!OAUTH_SETUP.md'
    - '!LICENSE.md'
    - '!CHANGELOG.md'
    - '!poetry.lock'
    - '!pyproject.toml'
    # vendor/actingweb/ is the whole actingweb repo (a git submodule --
    # git can't check out a single subdirectory of one), checked out here
    # purely so application.py can reach examples/demo/. actingweb the
    # *package* is installed separately via pip/poetry, so its own
    # actingweb/ subdirectory below is redundant weight; excluded along
    # with everything else in the submodule that isn't the demo app.
    - '!vendor/actingweb/**'
    - 'vendor/actingweb/examples/demo/**'
    - '!vendor/actingweb/examples/demo/__pycache__/**'
    - '!vendor/actingweb/examples/demo/**/__pycache__/**'

provider:
  # No `profile:` here deliberately: setting one forces the AWS SDK to
  # resolve credentials from a named profile in ~/.aws/credentials and
  # skips its env-var provider entirely -- breaks CI, which has no such
  # file and relies solely on the AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
  # env vars aws-actions/configure-aws-credentials exports in deploy.yml.
  # For a manual local deploy, export those two env vars (or run
  # `export AWS_PROFILE=your-profile-name`) before `serverless deploy`.
  name: aws
  runtime: python3.11
  memorySize: 256
  timeout: 29
  stage: ${self:custom.stage}
  region: us-west-1
  httpApi:
    # Use HTTP API v2 instead of REST API to avoid header remapping issues
    # HTTP API doesn't remap WWW-Authenticate header (critical for OAuth2)
    cors: true
    payload: '2.0'
  environment:
    APP_HOST_FQDN: 'demo.actingweb.io'
    APP_HOST_PROTOCOL: 'https://'
    LOG_LEVEL: 'DEBUG' # We use debug as this is a demo app
    OAUTH_CLIENT_ID: '${env:OAUTH_CLIENT_ID}'
    OAUTH_CLIENT_SECRET: '${env:OAUTH_CLIENT_SECRET}'
    OAUTH_PROVIDER: '${env:OAUTH_PROVIDER, "google"}'  # "google" or "github"
    NUKE_SECRET: '${env:NUKE_SECRET, ""}'  # Secret for /nuke endpoint (test cleanup)
  iam:
    role:   
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
            - dynamodb:CreateTable
            - dynamodb:DescribeTable
          Resource: "arn:aws:dynamodb:${opt:region, self:provider.region}:*:table/demo_*"

functions:
  app:
    handler: wsgi_handler.handler
    events:
      - httpApi: '*'  # Use HTTP API v2 instead of REST API to preserve WWW-Authenticate header
