[tool.poetry]
package-mode = false
name = "actingwebdemo"
version = "0.1.0"
description = "ActingWeb Demo Application"
authors = ["Greger Wedel <greger@greger.io>"]
readme = "README.md"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

[tool.poetry.dependencies]
python = "^3.11"
jinja2 = ">=3.1.2"
flask = ">=3.1.1,<4.0.0"
# Pinned to the vendor/actingweb git submodule (see .gitmodules), not
# PyPI: examples/demo/ -- the code application.py delegates to -- is
# deliberately excluded from the published wheel, so no version pin can
# provide it. The submodule tracks master for day-to-day CI; deploy.yml
# resolves and checks out a specific, PyPI-verified release tag
# independently of whatever this pin tracks day to day.
# develop = false deliberately: an editable install is a .pth-style
# reference back to vendor/actingweb, not a real copy -- Lambda packaging
# needs an actual installed copy of the actingweb package (application.py
# resolves examples/demo/ separately, via a path relative to itself, so
# it doesn't need editable mode either). Re-run `poetry install` after
# updating the submodule to pick up changes.
actingweb = { path = "vendor/actingweb", develop = false, extras = ["flask"] }
#actingweb = { version = ">=3.9.0", extras = ["flask"] }
python-dotenv = "^1.2.1"

[tool.poetry.group.dev.dependencies]
uwsgi = ">=2.0.23"
pydevd-pycharm = "*"
ruff = "^0.14.10"
pyright = "^1.1.407"
pytest = "^9.0.1"

[tool.pytest.ini_options]
# application.py lives at the repo root, not under tests/, so it isn't on
# sys.path via pytest's default "prepend" import mode.
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.urls]
"Homepage" = "https://demo.actingweb.io"
"Repository" = "https://github.com/actingweb/actingwebdemo"
