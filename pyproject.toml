[tool.poetry]
package-mode = false
name = "actingwebdemo"
version = "0.1.0"
description = "ActingWeb Demo Application"
authors = ["Greger Wedel <greger@greger.io>"]
readme = "README.rst"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

[tool.poetry.dependencies]
python = "^3.11"
jinja2 = ">=3.1.2"
flask = ">=3.1.1,<4.0.0"
# Pinned to the local actingweb source checkout for testing the
# examples/demo/ consolidation (actingweb PR #137) before a PyPI release
# exists to pin to instead. Swap back to a version pin once 3.14.1+ ships.
actingweb = { path = "../actingweb", develop = true, extras = ["flask"] }
#actingweb = { version = ">=3.9.0", extras = ["flask"] }
python-dotenv = "^1.2.1"

[tool.poetry.group.dev.dependencies]
uwsgi = ">=2.0.23"
pydevd-pycharm = "*"
ruff = "^0.14.10"
pyright = "^1.1.407"
pytest = "^9.0.1"

[tool.pytest.ini_options]
# application.py lives at the repo root, not under tests/, so it isn't on
# sys.path via pytest's default "prepend" import mode.
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.urls]
"Homepage" = "https://demo.actingweb.io"
"Repository" = "https://github.com/actingweb/actingwebdemo"
