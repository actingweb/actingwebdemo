name: Deploy to AWS Lambda

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      actingweb_ref:
        description: >-
          actingweb tag to deploy, e.g. v3.14.1 or v3.15.0rc1 (a pre-release
          is verified on TestPyPI). Leave empty to use the latest version
          published on the selected index.
        required: false
        default: ''
      pypi_index:
        description: 'Index for the latest version when actingweb_ref is empty'
        required: true
        default: 'pypi'
        type: choice
        options:
          - pypi
          - testpypi

# Serialize deploys to the single production stack so two runs can't race
# into a CloudFormation UPDATE_IN_PROGRESS conflict.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout actingwebdemo
        uses: actions/checkout@v5

      # Decide which actingweb release to deploy, and never deploy one that
      # is not actually installable:
      #
      # - push to master: the version vendor/actingweb is pinned to. The
      #   pin must be exactly that version's release tag commit, so merging
      #   a pin bump deploys what CI tested -- an rc or beta included, which
      #   is how actingweb pre-releases get tested on demo.actingweb.io.
      # - workflow_dispatch with actingweb_ref: that tag.
      # - workflow_dispatch without it: the latest version on pypi_index.
      #
      # A pre-release (aN, bN, rcN, .devN) is verified on TestPyPI, a final
      # release on PyPI. A version that is not published there fails here,
      # before anything is checked out or built.
      - name: Resolve and verify the actingweb release to deploy
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_REF: ${{ github.event.inputs.actingweb_ref }}
          DISPATCH_INDEX: ${{ github.event.inputs.pypi_index || 'pypi' }}
        run: |
          set -euo pipefail

          index_for() {
            if echo "$1" | grep -Eq '(a|b|rc)[0-9]+$|\.dev[0-9]+$'; then
              echo testpypi
            else
              echo pypi
            fi
          }

          if [ "$EVENT" = "push" ]; then
            PIN=$(git ls-tree HEAD vendor/actingweb | awk '{print $3}')
            if [ -z "$PIN" ]; then
              echo "::error::vendor/actingweb is not a submodule at HEAD"
              exit 1
            fi
            VERSION=$(curl -sf "https://raw.githubusercontent.com/actingweb/actingweb/$PIN/pyproject.toml" \
              | python3 -c "import sys, tomllib; d = tomllib.loads(sys.stdin.read()); print(d.get('project', {}).get('version') or d['tool']['poetry']['version'])")
            TAG_COMMIT=$(git ls-remote https://github.com/actingweb/actingweb.git "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -1 | awk '{print $1}')
            if [ "$TAG_COMMIT" != "$PIN" ]; then
              echo "::error::vendor/actingweb is pinned to $PIN, which is not the v$VERSION release tag (${TAG_COMMIT:-no such tag}). Pin a release tag, or deploy with workflow_dispatch."
              exit 1
            fi
            PYPI_INDEX=$(index_for "$VERSION")
            echo "Push: vendor/actingweb is pinned to v$VERSION ($PIN)"
          elif [ -n "$REQUESTED_REF" ]; then
            VERSION="${REQUESTED_REF#v}"
            PYPI_INDEX=$(index_for "$VERSION")
            echo "Explicit ref requested: $REQUESTED_REF (version $VERSION)"
          else
            PYPI_INDEX="$DISPATCH_INDEX"
            VERSION=""
          fi

          if [ "$PYPI_INDEX" = "testpypi" ]; then
            INDEX_URL="https://test.pypi.org/pypi/actingweb"
          else
            INDEX_URL="https://pypi.org/pypi/actingweb"
          fi

          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sf "$INDEX_URL/json" | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
            echo "No actingweb_ref given -- resolved latest $PYPI_INDEX version: $VERSION"
          fi

          if ! curl -sf -o /dev/null "$INDEX_URL/$VERSION/json"; then
            echo "::error::actingweb $VERSION is not published on $PYPI_INDEX -- refusing to deploy"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Verified: actingweb $VERSION is published on $PYPI_INDEX"

      # Checks out the exact release tag resolved and verified above. On a
      # push that is the pinned commit itself.
      - name: Check out actingweb at the resolved tag
        uses: actions/checkout@v5
        with:
          repository: actingweb/actingweb
          ref: ${{ steps.resolve.outputs.tag }}
          path: vendor/actingweb

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      # serverless-python-requirements' poetry: true mode shells out to
      # `poetry export` to build requirements.txt -- Poetry 2.x no longer
      # bundles that command, it requires this plugin explicitly. Without
      # it, `serverless deploy` fails with "Exited with code 1" and no
      # further detail (the plugin's actual stderr isn't surfaced by
      # serverless-python-requirements).
      - name: Install poetry-plugin-export
        run: poetry self add poetry-plugin-export

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Set up Node.js for Serverless
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Serverless Framework and plugins
        run: |
          # v3, not v4: v4 requires a license key and migrating is out of
          # scope here -- see thoughts/plans/2026-08-22-demo-app-consolidation.md
          # (actingweb repo) under "What We're NOT Doing".
          npm install -g serverless@3
          npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Deploy
        run: serverless deploy --verbose
        env:
          # serverless.yml's provider.profile: default reads
          # ~/.aws/credentials for local/manual deploys; configure-aws-
          # credentials above exports these instead, which the AWS SDK
          # picks up regardless of the profile setting.
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_PROVIDER: ${{ vars.OAUTH_PROVIDER || 'google' }}
          NUKE_SECRET: ${{ secrets.NUKE_SECRET }}

      - name: Verify deployment
        run: |
          echo "Waiting for API Gateway to propagate..."
          sleep 10
          echo "Testing health endpoint..."
          curl -f https://demo.actingweb.io/health || {
            echo "::error::Health check failed -- deployment may not be fully operational"
            exit 1
          }
          echo "Health check passed."

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployed actingweb ${{ steps.resolve.outputs.version }} (from ${{ github.event.inputs.pypi_index || 'pypi' }}) to demo.actingweb.io"
          else
            echo "Deploy failed -- see the failing step above."
          fi
